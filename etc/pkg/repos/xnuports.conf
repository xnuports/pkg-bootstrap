# xnuports/pkg repository configuration
# This file is installed to /opt/xnuports/etc/pkg/repos/xnuports.conf
#
# To use this repository:
#   pkg -c "/opt/xnuports/sbin/pkg" install <package>
#
# Or add to your pkg.conf:
#   REPOS_DIR = ["/opt/xnuports/etc/pkg/repos"];

xnuports: {
  url: "pkg+https://xnuports.github.io/xnuports/packages/macOS-${arch}/latest",
  enabled: true,
  mirror_type: "none",
  signature_type: "none",
  priority: 100
}
