# xnuports/pkg default configuration
# Installed to /opt/xnuports/etc/pkg/pkg.conf
#
# This is a template. The actual paths are configured during installation.

# ─── Essential Settings ──────────────────────────────────────────────────────

# Package database location
PKG_DBDIR = "/opt/xnuports/var/db/pkg";

# Cache directory
PKG_CACHEDIR = "/opt/xnuports/var/cache/pkg";

# Download cache (stores downloaded distfiles)
PKG_DOWNLOAD_CACHE = "/opt/xnuports/distfiles";

# Repository configuration directory
REPOS_DIR = ["/opt/xnuports/etc/pkg/repos"];

# System configuration directory
PKG_SYSCONFDIR = "/opt/xnuports/etc";

# ─── Repository URL ──────────────────────────────────────────────────────────
# 
# The repository URL is architecture-dependent:
#   arm64:  pkg+https://xnuports.github.io/xnuports/packages/macOS-arm64/latest
#   x86_64: pkg+https://xnuports.github.io/xnuports/packages/macOS-x86_64/latest
#
# Override with PACKAGESITE environment variable if needed.

# Default repository (architecture will be resolved at runtime)
PACKAGESITE = "pkg+https://xnuports.github.io/xnuports/packages/macOS-${arch}/latest";

# ─── Package Installation ────────────────────────────────────────────────────

# Do not assume yes for all prompts (security best practice)
ASSUME_ALWAYS_YES = false;

# Install dependencies automatically
ASSUME_ALWAYS_YES_DEPENDENCIES = false;

# ─── Build Settings ──────────────────────────────────────────────────────────

# Ports directory (when building from ports)
PORTSDIR = "/opt/xnuports/xnuports";

# Working directory prefix
WRKDIRPREFIX = "/opt/xnuports/var/tmp";

# Parallel build jobs
DEFAULT_BUILD_PARALLEL_JOBS = 4;

# ─── Package Metadata ────────────────────────────────────────────────────────

# ABI string for packages built on this system
ABI = "macOS-${arch}";
ALTABI = "macOS-${arch}";
PKG_ABI = "macOS-${arch}";

# ─── Security ────────────────────────────────────────────────────────────────

# Signature type (none until repository signing is set up)
SIGNATURE_TYPE = "none";

# Trusted public keys for package verification
# TRUSTED_PKG_PUBKEYS = [];

# ─── Advanced Settings ───────────────────────────────────────────────────────

# Enable sqlite caching
PKG_DB_UPDATE_TMP = "/opt/xnuports/var/tmp/pkg.db.tmp";

# Handle .so versioning
HANDLE_RESTRICTED = true;

# ─── Paths ───────────────────────────────────────────────────────────────────

# Package directory layout (similar to Homebrew):
#   /opt/xnuports/opt/<package-name>/  - Package files
#   /opt/xnuports/bin/                 - Symlinks to executables
#   /opt/xnuports/sbin/                - Symlinks to system executables
#   /opt/xnuports/lib/                 - Symlinks to libraries
#   /opt/xnuports/include/             - Symlinks to headers
#   /opt/xnuports/share/               - Symlinks to shared data

# These are automatically created during package installation
